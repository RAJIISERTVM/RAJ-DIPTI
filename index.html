<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dipti 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    color:white;
    text-align:center;
    overflow-x:hidden;

    /* FULL PINK THEME */
    background: linear-gradient(-45deg, #ff758c, #ff7eb3, #ff4d6d, #ff99ac);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* HEARTS */
#hearts{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.heart{
    position:absolute;
    bottom:-50px;
    color:#ff4d6d;
    animation: floatUp linear infinite;
}

@keyframes floatUp{
    to{
        transform: translateY(-110vh) scale(1.5);
        opacity:0;
    }
}

/* HEADER */
header{
    padding-top:50px;
}

h1{
    font-family:'Pacifico', cursive;
    font-size:2.7rem;
}

.subtitle{
    margin-top:10px;
}

/* GALLERY */
.gallery{
    margin-top:40px;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:15px;
    padding:20px;
}

.gallery img{
    width:100%;
    border-radius:15px;
    transition:0.4s;
}

.gallery img:hover{
    transform:scale(1.1);
}

/* LETTER */
.letter{
    margin:40px auto;
    max-width:600px;
    background: rgba(255,255,255,0.2);
    padding:20px;
    border-radius:15px;
    backdrop-filter: blur(12px);
}

/* BUTTON */
button{
    margin-top:20px;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    cursor:pointer;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    color:#ff4d6d;
    padding:30px;
    border-radius:20px;
    transition:0.4s;
}

.popup.show{
    transform:translate(-50%,-50%) scale(1);
}

/* SPECIAL HEART BUTTON */
.big-heart{
    font-size:60px;
    margin-top:30px;
    cursor:pointer;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1); color:#ff4d6d;}
    50%{transform:scale(1.2); color:#ff99ac;}
    100%{transform:scale(1); color:#ff4d6d;}
}

</style>
</head>

<body>

<div id="hearts"></div>

<!-- MUSIC -->
<audio autoplay loop controls>
    <source src="music.mp3" type="audio/mp3">
</audio>

<header>
    <h1>Happy Birthday Dipti 💖</h1>
    <div class="subtitle">You make my world brighter ✨</div>
</header>

<div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
</div>

<div class="letter">
    <div id="typedText"></div>
</div>

<!-- BIG HEART -->
<div class="big-heart" onclick="heartBurst()">💖</div>

<button onclick="showPopup()">Click for a surprise 💖</button>

<div class="popup" id="popup">
    I’m lucky to have you, Dipti 💖 <br><br>
    My love is only for you — always.
</div>

<script>

/* FLOATING HEARTS */
function createHeart(){
    const heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    heart.style.animationDuration=(Math.random()*5+5)+"s";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(()=>heart.remove(),10000);
}
setInterval(createHeart,300);

/* TYPING TEXT */
const text = "Dipti, happy birthday 💖 You are my happiness, my peace, and my everything. My heart belongs only to you. You make every moment beautiful ✨";

let i=0;
function type(){
    if(i<text.length){
        document.getElementById("typedText").innerHTML += text.charAt(i);
        i++;
        setTimeout(type,40);
    }
}
type();

/* POPUP */
function showPopup(){
    document.getElementById("popup").classList.add("show");
}
document.getElementById("popup").onclick=function(){
    this.classList.remove("show");
}

/* HEART BURST EFFECT */
function heartBurst(){
    for(let i=0;i<20;i++){
        createHeart();
    }
}

</script>

</body>
</html>
