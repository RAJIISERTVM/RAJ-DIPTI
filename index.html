<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day Dipti ❤️</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* GLOBAL STYLES */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    height:100vh;
    overflow-x:hidden;
    color:white;
    text-align:center;

    background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fcb69f, #c471ed);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}

/* animated gradient */
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* floating hearts container */
#hearts{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    overflow:hidden;
    z-index:-1;
}

/* heart style */
.heart{
    position:absolute;
    bottom:-50px;
    color:#ff4d6d;
    font-size:20px;
    animation: floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform: translateY(0) scale(1);
        opacity:1;
    }
    to{
        transform: translateY(-110vh) scale(1.5);
        opacity:0;
    }
}

/* ========================= */
/* HEADER */
/* ========================= */

header{
    padding-top:50px;
    animation: fadeIn 2s ease;
}

h1{
    font-family:'Pacifico', cursive;
    font-size:2.5rem;
}

.subtitle{
    margin-top:10px;
    font-size:1.2rem;
}

/* ========================= */
/* GALLERY */
/* ========================= */

.gallery{
    margin-top:40px;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:15px;
    padding:20px;
}

.gallery img{
    width:100%;
    border-radius:15px;
    cursor:pointer;
    transition:0.4s;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.gallery img:hover{
    transform:scale(1.1);
}

/* ========================= */
/* LETTER */
/* ========================= */

.letter{
    margin:40px auto;
    max-width:600px;
    background: rgba(255,255,255,0.15);
    padding:20px;
    border-radius:15px;
    backdrop-filter: blur(10px);
}

#typedText{
    font-size:1.1rem;
    min-height:120px;
}

/* ========================= */
/* BUTTON */
/* ========================= */

button{
    margin-top:20px;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    font-size:1rem;
    cursor:pointer;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px rgba(255,255,255,0.8);
}

/* ========================= */
/* POPUP */
/* ========================= */

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    color:#ff4d6d;
    padding:30px;
    border-radius:20px;
    font-size:1.3rem;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    transition:0.4s;
}

.popup.show{
    transform:translate(-50%,-50%) scale(1);
}

/* fade animation */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* mobile */
@media(max-width:600px){
    h1{
        font-size:1.8rem;
    }
}

</style>
</head>

<body>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Music -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<!-- Header -->
<header>
    <h1>Happy Valentine's Day Dipti ❤️</h1>
    <div class="subtitle">You are the most beautiful part of my life</div>
</header>

<!-- Gallery -->
<div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
</div>

<!-- Love Letter -->
<div class="letter">
    <div id="typedText"></div>
</div>

<!-- Button -->
<button onclick="showPopup()">Click here Dipti ❤️</button>

<!-- Popup -->
<div class="popup" id="popup">
    I love you Dipti ❤️ Forever and always.
</div>

<script>

/* ========================= */
/* FLOATING HEARTS */
/* ========================= */

function createHeart(){
    const heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    heart.style.animationDuration=(Math.random()*5+5)+"s";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,300);

/* ========================= */
/* TYPING ANIMATION */
/* ========================= */

const text = "Dipti, From the moment you came into my life, everything became more beautiful. You are my happiness, my peace, and my heart. Happy Valentine's Day, my love ❤️";

let index=0;

function type(){
    if(index < text.length){
        document.getElementById("typedText").innerHTML += text.charAt(index);
        index++;
        setTimeout(type,40);
    }
}

type();

/* ========================= */
/* POPUP */
/* ========================= */

function showPopup(){
    document.getElementById("popup").classList.add("show");
}

/* close popup on click */
document.getElementById("popup").onclick=function(){
    this.classList.remove("show");
}

</script>

</body>
</html>
